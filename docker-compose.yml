services:
  postgres:
    image: postgres:17
    container_name: ia-decision-postgres
    environment:
      POSTGRES_DB: adp
      POSTGRES_USER: adp
      POSTGRES_PASSWORD: adp
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adp -d adp"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-postgres:
    image: postgres:17
    container_name: ia-decision-airflow-postgres
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  airflow-init:
    build:
      context: .
      dockerfile: docker/airflow/Dockerfile
    image: ia-decision-airflow:local
    container_name: ia-decision-airflow-init
    depends_on:
      airflow-postgres:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
      AIRFLOW__WEBSERVER__SECRET_KEY: local-dev-secret-key
      ADP_POSTGRES_URL: postgresql+psycopg://adp:adp@postgres:5432/adp
      UV_PROJECT_ENVIRONMENT: /opt/airflow/.venvs/ia-decision-platform
      UV_LINK_MODE: copy
    volumes: &airflow-common-volumes
      - .:/opt/airflow/project
      - ./airflow/dags:/opt/airflow/dags
      - ${ADP_HOST_DATA_ROOT:-/home/melis/ia-decision-platform-data}:/opt/airflow/data
      - airflow_logs:/opt/airflow/logs
    working_dir: /opt/airflow/project
    user: "${AIRFLOW_UID:-50000}:0"
    command: >
      bash -c "airflow db migrate &&
      airflow users create
      --username airflow
      --password airflow
      --firstname Air
      --lastname Flow
      --role Admin
      --email airflow@example.com || true"

  airflow-webserver:
    image: ia-decision-airflow:local
    container_name: ia-decision-airflow-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    working_dir: /opt/airflow/project
    user: "${AIRFLOW_UID:-50000}:0"
    ports:
      - "8080:8080"
    command: airflow webserver
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  airflow-scheduler:
    image: ia-decision-airflow:local
    container_name: ia-decision-airflow-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    volumes: *airflow-common-volumes
    working_dir: /opt/airflow/project
    user: "${AIRFLOW_UID:-50000}:0"
    command: airflow scheduler

volumes:
  postgres_data:
  airflow_postgres_data:
  airflow_logs:
