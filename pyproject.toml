[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-decision-platform"
version = "0.1.0"
description = "Plateforme pédagogique Data et IA pour la décision énergétique"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["polars>=1,<2", "holidays>=0.70,<1"]

[project.optional-dependencies]
spark = ["pyspark>=4.0.1,<4.1", "delta-spark>=4.0.1,<4.1", "tzdata>=2025.2"]
dev = ["pytest>=8,<9", "ruff>=0.11,<1", "pre-commit>=4,<5"]
quality = [
    "colorama>=0.4.6,<1",
    "great-expectations>=1.0,<2",
]
serving = [
    "pandas>=2,<4",
    "psycopg[binary]>=3,<4",
    "sqlalchemy>=2,<3",
]
analytics = ["dbt-postgres>=1.9,<2"]
streaming = ["kafka-python-ng>=2.2,<3", "psycopg[binary]>=3,<4"]
mlops = ["mlflow>=3,<4"]
datascience = [
    "pandas>=2,<4",
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3,<4",
    "matplotlib>=3.9,<4",
    "seaborn>=0.13,<1",
    "scikit-learn>=1.5,<2",
    "xgboost>=2,<4",
    "jupyterlab>=4,<5",
    "ipykernel>=6,<8",
]

[project.scripts]
ai-decision-platform = "ai_decision_platform.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_decision_platform"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-third-party = ["kafka", "psycopg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

